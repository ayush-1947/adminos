services:
  postgres:
    image: postgres:17-bookworm
    profiles: [local]
    environment:
      POSTGRES_DB: useless_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d useless_os"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    restart: "no"
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
    expose: ["4000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
