# Database is hosted externally on Neon. No Render database is created.
services:
  - type: web
    name: operations-os-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @os/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false

  - type: web
    name: operations-os-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w @os/web
    startCommand: npm run start -w @os/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: API_INTERNAL_URL
        sync: false
