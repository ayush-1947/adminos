name: Validate Operations OS
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: operations_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-isolated-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-isolated-password@localhost:5432/operations_test
      DIRECT_URL: postgresql://postgres:ci-only-isolated-password@localhost:5432/operations_test
      SESSION_SECRET: ci-only-isolated-non-production-test-session-secret-123456789
      APP_ORIGIN: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
